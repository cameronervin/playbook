[project]
name = "playbook-load-tests"
version = "0.1.0"
description = "Locust load-test tooling for Playbook production readiness."
requires-python = ">=3.12"
dependencies = [
    "locust>=2.44.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
