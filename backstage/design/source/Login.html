<style>
/* ============================================================
   PLAYBOOK — Design Tokens
   Color + Type foundations for the Playbook agentic platform.
   Brand: OSU vivid orange on warm charcoal. Tech-forward, sharp.
   Load fonts via Google Fonts (see fonts/README or the @import below).
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');

/* Brand typefaces — self-hosted from uploaded variable fonts. */
@font-face {
  font-family: 'Archivo';
  src: url('fonts/Archivo-Variable.ttf') format('truetype-variations');
  font-weight: 100 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Archivo';
  src: url('fonts/Archivo-Italic-Variable.ttf') format('truetype-variations');
  font-weight: 100 900; font-style: italic; font-display: swap;
}
@font-face {
  font-family: 'Inter';
  src: url('fonts/Inter-Variable.ttf') format('truetype-variations');
  font-weight: 100 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Inter';
  src: url('fonts/Inter-Italic-Variable.ttf') format('truetype-variations');
  font-weight: 100 900; font-style: italic; font-display: swap;
}
@font-face {
  font-family: 'Sora';
  src: url('fonts/Sora-Variable.ttf') format('truetype-variations');
  font-weight: 100 800; font-style: normal; font-display: swap;
}

:root {
  /* ---------- Brand: Playbook Orange (OSU) ---------- */
  --orange-50:  #FFF3E9;
  --orange-100: #FFE0C4;
  --orange-200: #FFC089;
  --orange-300: #FF9D4D;
  --orange-400: #FF8224;
  --orange-500: #FF7300;   /* core brand orange */
  --orange-600: #E85F00;
  --orange-700: #C24C00;
  --orange-800: #8F3800;
  --orange-900: #5E2500;

  --brand:        var(--orange-500);
  --brand-hover:  var(--orange-400);
  --brand-press:  var(--orange-600);
  --brand-soft:   rgba(255, 115, 0, 0.14);  /* tinted fills */
  --brand-glow:   rgba(255, 115, 0, 0.35);  /* focus / active glow */

  /* ---------- Warm Charcoal Neutrals ---------- */
  /* Slight warm (orange/brown) undertone so darks feel cohesive,
     never cold blue-gray. */
  --ink-1000: #0C0B09;   /* deepest — app shell void */
  --ink-950:  #100F0C;   /* page background */
  --ink-900:  #16140F;   /* base background */
  --ink-850:  #1C1A14;   /* surface */
  --ink-800:  #221F18;   /* raised surface / cards */
  --ink-750:  #2A271E;   /* hover surface */
  --ink-700:  #332F25;   /* border strong */
  --ink-600:  #423D30;   /* divider on raised */
  --ink-500:  #5A5343;   /* faint text / disabled */
  --ink-400:  #7E7665;   /* muted text */
  --ink-300:  #A89E8B;   /* secondary text */
  --ink-200:  #CFC6B5;   /* high secondary */
  --ink-100:  #E9E2D5;   /* near-white warm */
  --ink-050:  #F6F1E8;   /* warm white */

  /* ---------- Foreground (text on dark) ---------- */
  --fg-1: #F6F1E8;   /* primary text */
  --fg-2: #C2B9A8;   /* secondary text */
  --fg-3: #8E8674;   /* muted / captions */
  --fg-4: #5A5343;   /* faint / placeholder */
  --fg-on-brand: #16140F;  /* text on orange fills */

  /* ---------- Backgrounds & Surfaces ---------- */
  --bg-void:     var(--ink-1000);
  --bg-page:     var(--ink-950);
  --bg-base:     var(--ink-900);
  --surface:     var(--ink-850);
  --surface-raised: var(--ink-800);
  --surface-hover:  var(--ink-750);

  /* ---------- Borders ---------- */
  --border:        rgba(246, 241, 232, 0.08);  /* hairline on dark */
  --border-strong: rgba(246, 241, 232, 0.14);
  --border-solid:  var(--ink-700);
  --border-brand:  rgba(255, 115, 0, 0.45);

  /* ---------- Semantic ---------- */
  --success:    #3FB68B;
  --success-bg: rgba(63, 182, 139, 0.14);
  --warning:    #F4A93C;
  --warning-bg: rgba(244, 169, 60, 0.14);
  --danger:     #F0563F;
  --danger-bg:  rgba(240, 86, 63, 0.14);
  --info:       #4FB6C7;   /* teal, NOT blue — avoids the AI-blue trope */
  --info-bg:    rgba(79, 182, 199, 0.14);

  /* Agent status accents */
  --agent-thinking: var(--info);
  --agent-active:   var(--orange-500);
  --agent-done:     var(--success);

  /* ---------- Typography: families ---------- */
  --font-display: 'Archivo', system-ui, sans-serif;          /* headlines, display, eyebrows */
  --font-display-alt: 'Sora', system-ui, sans-serif;         /* alternate geometric display */
  --font-body:    'Inter', system-ui, sans-serif;            /* body, UI labels */
  --font-mono:    'JetBrains Mono', ui-monospace, monospace; /* system data: filenames, latency, code */

  /* ---------- Type scale (px / rem on 16) ---------- */
  --text-2xs: 0.6875rem;  /* 11 */
  --text-xs:  0.75rem;    /* 12 */
  --text-sm:  0.875rem;   /* 14 */
  --text-base:1rem;       /* 16 */
  --text-md:  1.125rem;   /* 18 */
  --text-lg:  1.375rem;   /* 22 */
  --text-xl:  1.75rem;    /* 28 */
  --text-2xl: 2.25rem;    /* 36 */
  --text-3xl: 3rem;       /* 48 */
  --text-4xl: 4rem;       /* 64 */
  --text-5xl: 5.5rem;     /* 88 */

  /* ---------- Weights ---------- */
  --w-regular: 400;
  --w-medium:  500;
  --w-semibold:600;
  --w-bold:    700;
  --w-extra:   800;
  --w-black:   900;

  /* ---------- Tracking ---------- */
  --track-tight:  -0.02em;
  --track-snug:   -0.01em;
  --track-normal: 0;
  --track-wide:   0.04em;
  --track-caps:   0.12em;   /* eyebrows / overlines */

  /* ---------- Spacing (4px base) ---------- */
  --space-0: 0;
  --space-1: 0.25rem;  /* 4  */
  --space-2: 0.5rem;   /* 8  */
  --space-3: 0.75rem;  /* 12 */
  --space-4: 1rem;     /* 16 */
  --space-5: 1.5rem;   /* 24 */
  --space-6: 2rem;     /* 32 */
  --space-7: 3rem;     /* 48 */
  --space-8: 4rem;     /* 64 */
  --space-9: 6rem;     /* 96 */

  /* ---------- Radii (sharp / tight) ---------- */
  --radius-xs: 3px;
  --radius-sm: 5px;
  --radius-md: 8px;    /* default control radius */
  --radius-lg: 12px;   /* cards */
  --radius-xl: 16px;
  --radius-pill: 999px;

  /* ---------- Elevation ---------- */
  /* On dark UI: rely on borders + low, warm shadows. */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.45);
  --shadow-lg: 0 16px 48px rgba(0,0,0,0.55);
  --shadow-glow: 0 0 0 3px var(--brand-glow);
  --shadow-focus: 0 0 0 3px var(--brand-glow);

  /* ---------- Motion ---------- */
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-fast: 120ms;
  --dur-med:  200ms;
  --dur-slow: 360ms;
}

/* ============================================================
   SEMANTIC TYPE ROLES
   Apply these classes (or copy the rules) for consistent type.
   ============================================================ */

/* Eyebrow / kicker — sentence-case bold sans in brand orange.
   Deliberately NOT monospace-uppercase-letterspaced (that reads as AI-generated). */
.pb-eyebrow {
  font-family: var(--font-body);
  font-weight: var(--w-bold);
  font-size: var(--text-sm);
  letter-spacing: var(--track-normal);
  color: var(--brand);
}

.pb-display {
  font-family: var(--font-display);
  font-weight: var(--w-black);
  font-size: var(--text-5xl);
  line-height: 0.96;
  letter-spacing: var(--track-tight);
  color: var(--fg-1);
  text-wrap: balance;
}

.pb-h1 {
  font-family: var(--font-display);
  font-weight: var(--w-extra);
  font-size: var(--text-3xl);
  line-height: 1.02;
  letter-spacing: var(--track-tight);
  color: var(--fg-1);
  text-wrap: balance;
}

.pb-h2 {
  font-family: var(--font-display);
  font-weight: var(--w-bold);
  font-size: var(--text-2xl);
  line-height: 1.06;
  letter-spacing: var(--track-snug);
  color: var(--fg-1);
}

.pb-h3 {
  font-family: var(--font-display);
  font-weight: var(--w-bold);
  font-size: var(--text-xl);
  line-height: 1.12;
  letter-spacing: var(--track-snug);
  color: var(--fg-1);
}

.pb-h4 {
  font-family: var(--font-body);
  font-weight: var(--w-semibold);
  font-size: var(--text-lg);
  line-height: 1.2;
  letter-spacing: var(--track-snug);
  color: var(--fg-1);
}

.pb-lead {
  font-family: var(--font-body);
  font-weight: var(--w-regular);
  font-size: var(--text-md);
  line-height: 1.5;
  color: var(--fg-2);
}

.pb-body {
  font-family: var(--font-body);
  font-weight: var(--w-regular);
  font-size: var(--text-base);
  line-height: 1.6;
  color: var(--fg-2);
}

.pb-small {
  font-family: var(--font-body);
  font-weight: var(--w-regular);
  font-size: var(--text-sm);
  line-height: 1.5;
  color: var(--fg-3);
}

.pb-label {
  font-family: var(--font-body);
  font-weight: var(--w-semibold);
  font-size: var(--text-sm);
  letter-spacing: var(--track-normal);
  color: var(--fg-1);
}

.pb-mono {
  font-family: var(--font-mono);
  font-weight: var(--w-regular);
  font-size: var(--text-sm);
  letter-spacing: var(--track-snug);
  color: var(--fg-2);
}

/* Machine metadata — mono, but NEVER uppercase/letterspaced as decoration.
   Reserved for real system output: latency, counts, log-style lines. */
.pb-meta {
  font-family: var(--font-mono);
  font-weight: var(--w-regular);
  font-size: var(--text-xs);
  letter-spacing: var(--track-normal);
  color: var(--fg-3);
}

/* Data token — filenames, IDs, code spans. The only home for mono. */
.pb-token {
  font-family: var(--font-mono);
  font-weight: var(--w-medium);
  font-size: var(--text-xs);
  color: var(--fg-2);
}

</style>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg-page);
    font-family: var(--font-body);
    color: var(--fg-1);
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }

  /* page backdrop: warm vignette + optional faint orange glow behind the mark */
  .auth-stage {
    position: relative; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: var(--space-6) var(--space-5);
    overflow: hidden;
  }
  .auth-stage::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,115,0,0.05), transparent 55%),
      linear-gradient(180deg, var(--bg-base) 0%, var(--bg-page) 38%, var(--bg-void) 100%);
    pointer-events: none;
  }
  .glow {
    position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
    width: 460px; height: 460px; pointer-events: none;
    background: radial-gradient(circle, rgba(255,115,0,0.16), transparent 64%);
    filter: blur(8px);
  }
  /* faint hairline grid */
  .grid {
    position: absolute; inset: 0; pointer-events: none; opacity: 1;
    background-image:
      linear-gradient(rgba(246,241,232,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(246,241,232,0.05) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(120% 95% at 50% 32%, #000 38%, transparent 84%);
    -webkit-mask-image: radial-gradient(120% 95% at 50% 32%, #000 38%, transparent 84%);
  }

  /* canvas background fields */
  .fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .fx-horizon {
    mask-image: linear-gradient(180deg, transparent 48%, #000 70%, #000 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 48%, #000 70%, #000 100%);
  }
  .fx-ember {
    mask-image: radial-gradient(120% 100% at 50% 42%, #000 28%, transparent 84%);
    -webkit-mask-image: radial-gradient(120% 100% at 50% 42%, #000 28%, transparent 84%);
  }

  /* ambient aurora — soft warm blooms drifting behind a faint precision grid */
  .ambient { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .ambient .bloom {
    position: absolute; border-radius: 50%; filter: blur(46px); will-change: transform, opacity;
    mix-blend-mode: screen;
  }
  .ambient .bloom-a {
    width: 62vw; height: 62vw; max-width: 760px; max-height: 760px; left: 12%; top: 2%;
    background: radial-gradient(circle, rgba(255,115,0,0.16), rgba(255,115,0,0.05) 44%, transparent 70%);
    animation: driftA 38s var(--ease-in-out) infinite alternate;
  }
  .ambient .bloom-b {
    width: 52vw; height: 52vw; max-width: 620px; max-height: 620px; right: 8%; top: 26%;
    background: radial-gradient(circle, rgba(255,156,64,0.12), transparent 66%);
    animation: driftB 50s var(--ease-in-out) infinite alternate;
  }
  .ambient .bloom-c {
    width: 46vw; height: 46vw; max-width: 540px; max-height: 540px; left: 30%; bottom: -6%;
    background: radial-gradient(circle, rgba(200,70,0,0.10), transparent 68%);
    animation: driftC 64s var(--ease-in-out) infinite alternate;
  }
  .ambient .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(246,241,232,0.05) 1px, transparent 1.5px);
    background-size: 23px 23px;
    mask-image: radial-gradient(120% 100% at 50% 36%, #000 32%, transparent 82%);
    -webkit-mask-image: radial-gradient(120% 100% at 50% 36%, #000 32%, transparent 82%);
  }
  @keyframes driftA { from { transform: translate(-7%, -4%) scale(1); } to { transform: translate(9%, 7%) scale(1.16); } }
  @keyframes driftB { from { transform: translate(6%, 4%) scale(1.08); } to { transform: translate(-8%, -6%) scale(0.94); } }
  @keyframes driftC { from { transform: translate(-5%, 4%) scale(1); } to { transform: translate(7%, -5%) scale(1.12); } }
  .ambient.still .bloom { animation: none; }
  @media (prefers-reduced-motion: reduce) { .ambient .bloom { animation: none; } }

  .col { position: relative; z-index: 2; width: 100%; max-width: 380px; }

  /* card — everything lives inside, taller rectangular proportion */
  .card {
    width: 100%; background: var(--surface-raised);
    border: 1px solid var(--border-strong); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: var(--space-8) var(--space-6) var(--space-5);
    display: flex; flex-direction: column; align-items: center;
    animation: rise var(--dur-med) var(--ease-out) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

  /* logo lockup — at top, inside the card */
  .lockup { display: flex; align-items: center; gap: 11px; }
  .wordmark { font-family: var(--font-display); font-weight: var(--w-extra); font-size: 26px; letter-spacing: var(--track-tight); color: var(--fg-1); line-height: 1; }

  .eyebrow { font-weight: var(--w-bold); font-size: var(--text-sm); color: var(--brand); margin: var(--space-5) 0 0; text-align: center; }
  .headline { font-family: var(--font-display); font-weight: var(--w-bold); font-size: var(--text-md); line-height: 1.2; letter-spacing: var(--track-snug); margin: var(--space-5) 0 0; color: var(--fg-1); text-align: center; }
  .headline.upper { text-transform: uppercase; letter-spacing: var(--track-normal); }
  .headline.alt { font-family: var(--font-display-alt); font-weight: var(--w-semibold); text-transform: none; }

  .providers { display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-6); width: 100%; }

  .sso {
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    font-family: var(--font-body); font-weight: var(--w-semibold); font-size: var(--text-base);
    color: var(--fg-1); cursor: pointer;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-md); padding: 13px 16px;
    transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .sso:hover { background: var(--surface-hover); border-color: var(--border-strong); }
  .sso:active { transform: translateY(1px); }
  .sso:focus-visible { outline: none; box-shadow: var(--shadow-focus); border-color: var(--border-brand); }
  .sso .glyph { width: 20px; height: 20px; flex: none; display: grid; place-items: center; }

  /* tile variant: provider mark boxed on the left, label centered in the rest */
  .sso.tile { padding: 0; gap: 0; }
  .sso.tile .glyph { width: 50px; height: 50px; border-right: 1px solid var(--border); background: var(--surface-raised); border-radius: var(--radius-md) 0 0 var(--radius-md); }
  .sso.tile .label { flex: 1; text-align: center; padding: 15px 50px 15px 0; }

  .support { display: inline-flex; align-items: center; gap: 7px; margin-top: var(--space-4); font-size: var(--text-sm); color: var(--fg-3); text-decoration: none; }
  .support:hover { color: var(--fg-2); }

  /* footer — divider + tagline + legal links, inside the card */
  .cardfoot { width: 100%; margin-top: var(--space-6); padding-top: var(--space-5); border-top: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
  .foottag { margin: 0; font-size: var(--text-xs); color: var(--fg-3); text-align: center; line-height: 1.5; max-width: 28ch; }
  .footlinks { display: flex; align-items: center; gap: 10px; font-size: var(--text-xs); }
  .footlinks a { color: var(--fg-3); text-decoration: none; }
  .footlinks a:hover { color: var(--fg-1); }
  .footlinks .dot { color: var(--fg-4); }

  .sysline { margin-top: var(--space-1); font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--fg-4); letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; }
  .sysdot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex: none; animation: syspulse 2.4s var(--ease-in-out) infinite; }
  @keyframes syspulse { 0% { box-shadow: 0 0 0 0 var(--success-bg); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { .sysdot { animation: none; } }
</style>
</head>

<script type="text/babel">


const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

function Ambient({ anim }) {
  return (
    <div className={'ambient' + (anim ? '' : ' still')} aria-hidden="true">
      <div className="bloom bloom-a" />
      <div className="bloom bloom-b" />

      <div className="dots" />
    </div>

}

function HorizonGrid({ anim }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const canvas = ref.current, ctx = canvas.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches || !anim;
    let w = 0, h = 0, raf = 0, t = 0;
    const COLS = 22, ROWS = 22, STEP = 1, NEAR = 2.0, WAMP = 0.2, WF = 0.95, ZF = 0.5, TSPD = 0.9;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      const horizonY = h * 0.6, cx = w / 2, focal = h * 0.92, camH = 1.0;
      const off = (t * 0.45) % STEP;
      function proj(wx, z) {
        const ps = focal / z;
        const elev = WAMP * Math.sin(wx * WF + z * ZF + t * TSPD);
        return [cx + wx * ps, horizonY + (camH - elev) * ps];
      }
      // receding columns
      for (let c = -COLS; c <= COLS; c++) {
        ctx.strokeStyle = 'rgba(255,120,10,0.10)';
        ctx.lineWidth = 1; ctx.beginPath();
        let first = true;
        for (let r = 0; r < ROWS; r++) {
          const z = NEAR + r * STEP - off; if (z <= 0.25) continue;
          const p = proj(c * 0.5, z);
          if (first) { ctx.moveTo(p[0], p[1]); first = false; } else ctx.lineTo(p[0], p[1]);
        }
        ctx.stroke();
      }
      // waving rows
      for (let r = 0; r < ROWS; r++) {
        const z = NEAR + r * STEP - off; if (z <= 0.25) continue;
        const fade = Math.max(0, 1 - (z - NEAR) / (ROWS * STEP));
        ctx.strokeStyle = 'rgba(255,120,10,' + (0.55 * fade * fade).toFixed(3) + ')';
        ctx.lineWidth = 1; ctx.beginPath();
        for (let c = -COLS; c <= COLS; c++) {
          const p = proj(c * 0.5, z);
          if (c === -COLS) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
        }
        ctx.stroke();
      }
      if (!reduce) { t += 0.016; raf = requestAnimationFrame(draw); }
    }
    resize(); draw();
    const onR = () => { resize(); if (reduce) draw(); };
    window.addEventListener('resize', onR);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', onR); };
  }, [anim]);
  return <canvas ref={ref} className="fx fx-horizon" />;
}

function Ember({ anim }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const canvas = ref.current, ctx = canvas.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches || !anim;
    let w = 0, h = 0, raf = 0, tt = 0, ps = [];
    function build() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.max(26, Math.min(84, Math.round(w * h / 15000)));
      ps = [];
      for (let i = 0; i < n; i++) ps.push({ x: Math.random() * w, y: Math.random() * h, vy: 0.12 + Math.random() * 0.32, ph: Math.random() * 6.28, sp: 0.4 + Math.random() * 0.6, r: 0.6 + Math.random() * 1.4, hot: Math.random() < 0.5 });
    }
    function frame() {
      tt += 0.016;
      ctx.clearRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';
      for (const p of ps) {
        p.y -= p.vy; p.x += Math.sin(tt * p.sp + p.ph) * 0.22;
        if (p.y < -6) { p.y = h + 6; p.x = Math.random() * w; }
        const tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(tt * 1.5 * p.sp + p.ph));
        ctx.fillStyle = p.hot ? 'rgba(255,140,52,' + (0.5 * tw).toFixed(3) + ')' : 'rgba(246,241,232,' + (0.3 * tw).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      if (!reduce) raf = requestAnimationFrame(frame);
    }
    build(); frame();
    const onR = () => { build(); if (reduce) frame(); };
    window.addEventListener('resize', onR);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', onR); };
  }, [anim]);
  return <canvas ref={ref} className="fx fx-ember" />;
}

function Mark({ size = 24, color = '#F6F1E8' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 512 512" fill="none" aria-hidden="true" style={{ flex: 'none' }}>
      <path fill={color} d="M32 402.84 L100.86 402.84 L169.72 283.38 L377.13 283.38 L480 104.18 L342.28 104.18 L308.27 163.91 L377.13 163.91 L342.28 223.64 L135.70 223.64 Z" />
      <path fill="#FF7300" d="M204.56 104.18 L272.59 104.18 L238.58 163.91 L169.72 163.91 Z" />
      <path fill="#FF7300" d="M291.67 321.54 L359.70 321.54 L314.90 407.82 L249.36 407.82 Z" />
    </svg>);

}

function GoogleLogo() {
  return (
    <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" />
      <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" />
      <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z" />
      <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z" />
    </svg>);

}

function MicrosoftLogo() {
  return (
    <svg width="19" height="19" viewBox="0 0 23 23" aria-hidden="true">
      <rect x="1" y="1" width="10" height="10" fill="#F25022" />
      <rect x="12" y="1" width="10" height="10" fill="#7FBA00" />
      <rect x="1" y="12" width="10" height="10" fill="#00A4EF" />
      <rect x="12" y="12" width="10" height="10" fill="#FFB900" />
    </svg>);

}

function SSOButton({ provider, tile }) {
  const isMs = provider === 'ms';
  return (
    <button className={'sso' + (tile ? ' tile' : '')} type="button">
      <span className="glyph">{isMs ? <MicrosoftLogo /> : <GoogleLogo />}</span>
      <span className="label">Continue with {isMs ? 'Microsoft' : 'Google'}</span>
    </button>);

}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const order = t.buttonOrder === 'google' ? ['google', 'ms'] : ['ms', 'google'];
  const headClass = 'headline' + (t.headline === 'software' ? ' alt' : t.headline === 'display' ? ' upper' : '');

  return (
    <React.Fragment>
      <div className="auth-stage">
        {(t.bg === 'aurora' || t.bg === 'network') && <Ambient anim={t.glow} />}
        {t.bg === 'horizon' && <HorizonGrid anim={t.glow} />}
        {t.bg === 'ember' && <Ember anim={t.glow} />}
        {t.bg === 'grid' && <div className="grid" />}

        <div className="col">
          <div className="card" style={{ gap: "4px", justifyContent: "flex-start", flexDirection: "column" }}>
            <div className="lockup">
              <Mark size={34} />
              <span className="wordmark">Playbook</span>
            </div>

            {t.eyebrow && <p className="eyebrow">Agentic AI for athletics</p>}
            <h1 className={headClass} style={{ fontSize: "18px" }}>Log in to continue</h1>

            <div className="providers">
              {order.map((p) => <SSOButton key={p} provider={p} tile={t.buttonStyle === 'tile'} />)}
            </div>

            {t.support &&
            <a className="support" href="#">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg> Can't log in?
            </a>
            }

            <div className="cardfoot" style={{ textAlign: "left", gap: "12px", padding: "6px 0px 0px", margin: "32px 0px 0px" }}>
              <p className="foottag"></p>
              <div className="footlinks">
                <a href="#">Privacy Policy</a>
                <span className="dot">·</span>
                <a href="#">Terms of Service</a>
              </div>
              {t.sysline &&
              <div className="sysline">
                <span className="sysdot" />
                All systems operational · SSO via SAML 2.0
              </div>
              }
            </div>
          </div>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Layout" />
        <TweakRadio label="Button style" value={t.buttonStyle}
        options={['centered', 'tile']}
        onChange={(v) => setTweak('buttonStyle', v)} />
        <TweakRadio label="Button order" value={t.buttonOrder}
        options={['ms', 'google']}
        onChange={(v) => setTweak('buttonOrder', v)} />
        <TweakSection label="Headline" />
        <TweakRadio label="Style" value={t.headline}
        options={['display', 'sentence', 'software']}
        onChange={(v) => setTweak('headline', v)} />
        <TweakToggle label="Eyebrow" value={t.eyebrow}
        onChange={(v) => setTweak('eyebrow', v)} />
        <TweakSection label="Background" />
        <TweakRadio label="Field" value={t.bg === 'network' ? 'aurora' : t.bg}
        options={['aurora', 'horizon', 'ember', 'grid', 'plain']}
        onChange={(v) => setTweak('bg', v)} />
        <TweakToggle label="Background motion" value={t.glow}
        onChange={(v) => setTweak('glow', v)} />
        <TweakSection label="Extras" />
        <TweakToggle label="Support link" value={t.support}
        onChange={(v) => setTweak('support', v)} />
        <TweakToggle label="System status line" value={t.sysline}
        onChange={(v) => setTweak('sysline', v)} />
      </TweaksPanel>
    </React.Fragment>);

}

function mount() {
  if (typeof useTweaks === 'undefined' || typeof TweaksPanel === 'undefined') {
    return setTimeout(mount, 25);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
mount();
</script>
</body>
</html>
