[project]
name = "playbook-kb-service"
version = "0.1.0"
description = "Playbook knowledge-base ingestion and retrieval service."
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "boto3>=1.34",
    "celery[redis]>=5.4",
    "docling>=1.16.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-text-splitters>=0.3",
    "openai>=1.40",
    "openpyxl>=3.1",
    "pgvector>=0.3",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "pydantic>=2.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.0",
    "tiktoken>=0.7",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.23",
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false
