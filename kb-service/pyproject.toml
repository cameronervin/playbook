[project]
name = "playbook-kb-service"
version = "0.1.0"
description = "Playbook knowledge-base ingestion and retrieval service."
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "alembic>=1.18.5",
    "asyncpg>=0.29",
    "boto3>=1.43.40",
    "celery[redis]>=5.6.3",
    "docling>=2.110.0",
    "fastapi>=0.139.0",
    "httpx>=0.27",
    "langchain-openai>=1.3.3",
    "langchain-text-splitters>=0.3",
    "langchain>=1.3.11",
    "langgraph>=1.2.7",
    "openai>=2.44.0",
    "openpyxl>=3.1",
    "pgvector>=0.3",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.14.2",
    "pydantic>=2.0",
    "pymupdf>=1.28.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0",
    "redis>=5.0.0",
    "sentry-sdk>=2.64.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "tiktoken>=0.7",
    "uvicorn[standard]>=0.50.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.23",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.uv]
package = false
