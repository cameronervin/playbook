# Reverse proxy: serve the Next.js frontend, proxy /api to backend.
# Used in production (mounted at /etc/nginx/nginx.conf).
#
# TLS certificates are expected at:
#   /etc/letsencrypt/live/playbook/fullchain.pem
#   /etc/letsencrypt/live/playbook/privkey.pem
# Create or symlink that directory from the environment's real certificate path.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;

    client_body_buffer_size 256k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    client_max_body_size 10m;
    large_client_header_buffers 4 16k;
    keepalive_timeout 65s;
    send_timeout 30s;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_max_temp_file_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $http_user_agent $user_agent_present {
        default true;
        "" false;
    }

    map $http_referer $referer_present {
        default true;
        "" false;
    }

    log_format playbook_json escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"host":"$host",'
        '"scheme":"$scheme",'
        '"user_agent_present":$user_agent_present,'
        '"referer_present":$referer_present}';

    access_log /dev/stdout playbook_json;
    error_log /dev/stderr warn;

    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            return 204;
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/playbook/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/playbook/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

        location = /healthz {
            access_log off;
            return 204;
        }

        # API requests to FastAPI backend.
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # WebSocket / streaming endpoints (e.g. streamed agent responses).
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Everything else to Next.js frontend.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
