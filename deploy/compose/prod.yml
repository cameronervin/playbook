# Production overrides — no volumes, replicas, internal DB, resource limits.
# Usage: docker compose -f base.yml -f prod.yml up -d
# Note: supply secrets via a secrets manager, not committed env files.

services:
  db:
    env_file:
      - ../envs/.env.prod
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    # No exposed ports in production — DB stays on the internal network.

  valkey:
    env_file:
      - ../envs/.env.prod
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    env_file:
      - ../envs/.env.prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  frontend:
    env_file:
      - ../envs/.env.prod
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  celery-worker:
    env_file:
      - ../envs/.env.prod
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G

  # Reverse proxy — serves frontend, proxies /api → backend.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 128M
