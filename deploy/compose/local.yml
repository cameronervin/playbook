# Local development overrides — bind mounts, hot reload, exposed ports.
# Usage: docker compose -f base.yml -f local.yml up

services:
  db:
    ports:
      - "5433:5432"
    env_file:
      - ../envs/.env.local
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=${DB_PASSWORD:-localpass}
      - POSTGRES_DB=playbook

  valkey:
    ports:
      - "6379:6379"
    env_file:
      - ../envs/.env.local

  litellm-db-init:
    image: postgres:16-alpine
    env_file:
      - ../envs/.env.local
      - ../envs/.env.litellm.local
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        export PGPASSWORD="$${POSTGRES_PASSWORD:-$${DB_PASSWORD:-localpass}}"
        db_user="$${POSTGRES_USER:-$${DB_USER:-app}}"
        db_name="$${POSTGRES_DB:-$${DB_NAME:-playbook}}"
        psql -h db -U "$${db_user}" -d "$${db_name}" -tAc "SELECT 1 FROM pg_database WHERE datname='litellm'" | grep -q 1 || \
          psql -h db -U "$${db_user}" -d "$${db_name}" -c "CREATE DATABASE litellm OWNER \"$${db_user}\""
    restart: "no"

  litellm:
    ports:
      - "4000:4000"
    env_file:
      - ../envs/.env.litellm.local
    depends_on:
      db:
        condition: service_healthy
      litellm-db-init:
        condition: service_completed_successfully

  backend:
    ports:
      - "8000:8000"
    env_file:
      - ../envs/.env.local
    volumes:
      - ../../backend:/app/backend
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    environment:
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      litellm:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      kb-api:
        condition: service_healthy

  frontend:
    ports:
      - "3000:3000"
    env_file:
      - ../envs/.env.local
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  # Local S3-compatible object storage via MinIO (see docs/guides/minio_setup.md).
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../envs/.env.local
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-bootstrap:
    image: quay.io/minio/mc:latest
    env_file:
      - ../envs/.env.local
      - ../envs/.env.kb-service.local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        /usr/bin/mc mb --ignore-existing "local/$${S3_BUCKET_NAME}"

  celery-worker:
    env_file:
      - ../envs/.env.local
    volumes:
      - ../../backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully

  kb-api:
    ports:
      - "8001:8001"
    env_file:
      - ../envs/.env.kb-service.local
    volumes:
      - ../../kb-service:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8001
    depends_on:
      db:
        condition: service_healthy
      kb-valkey:
        condition: service_healthy
      litellm:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully

  kb-valkey:
    ports:
      - "6380:6379"

  kb-worker-cpu:
    env_file:
      - ../envs/.env.kb-service.local
    volumes:
      - ../../kb-service:/app
    depends_on:
      db:
        condition: service_healthy
      kb-valkey:
        condition: service_healthy
      litellm:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully

  kb-worker-io:
    env_file:
      - ../envs/.env.kb-service.local
    volumes:
      - ../../kb-service:/app
    depends_on:
      db:
        condition: service_healthy
      kb-valkey:
        condition: service_healthy
      litellm:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully

volumes:
  minio_data:
    name: playbook_minio_data
