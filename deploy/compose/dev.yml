# Dev server overrides — built images, exposed API, no bind mounts.
# Usage: docker compose -f base.yml -f dev.yml up -d

services:
  db:
    ports:
      - "5433:5432"
    env_file:
      - ../envs/.env.dev
    environment:
      - POSTGRES_USER=${DB_USER:-app}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-appdb}

  valkey:
    env_file:
      - ../envs/.env.dev

  backend:
    ports:
      - "8000:8000"
    env_file:
      - ../envs/.env.dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  frontend:
    ports:
      - "3000:3000"
    env_file:
      - ../envs/.env.dev

  celery-worker:
    env_file:
      - ../envs/.env.dev
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
