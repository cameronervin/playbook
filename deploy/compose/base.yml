# Base configuration — shared across all environments.
# Usage: docker compose -f base.yml -f <env>.yml up
#
# Environment-specific values (ports, volumes, replicas, env files) live in the
# override files (local.yml / dev.yml / prod.yml).

services:
  db:
    # pgvector image (Postgres 16 + the `vector` extension) — required by
    # kb-service for embedding similarity search. Drop-in for plain postgres:16.
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Valkey — broker/result backend for Celery (optional async work).
  valkey:
    image: valkey/valkey:7-alpine
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - valkey_data:/data
    restart: unless-stopped

  # LiteLLM Proxy — OpenAI-compatible LLM gateway for chat, embeddings, evals,
  # virtual keys, budgets, and spend tracking. Provider credentials live only in
  # the LiteLLM env file / secrets manager, not in app service env files.
  litellm:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.litellm
      args:
        LITELLM_IMAGE_TAG: ${LITELLM_IMAGE_TAG:-1.84.1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; [urllib.request.urlopen(url, timeout=5).read() for url in ('http://localhost:4000/health/liveliness', 'http://localhost:4000/health/readiness')]\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/docker/Dockerfile.frontend
    depends_on:
      - backend
    restart: unless-stopped

  # Optional async worker. Enable with the "worker" profile:
  #   docker compose -f base.yml -f <env>.yml --profile worker up
  celery-worker:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    command: celery -A app.workers.app:backend_worker worker -Q backend-agent,backend-files,backend-insights,backend-maintenance --concurrency=2 --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - worker

  # ---------------------------------------------------------------------------
  # KB Service — RAG ingestion & retrieval (docling → OpenAI embeddings →
  # pgvector). The backend talks to it over HTTP via LocalKBProvider
  # (KB_LOCAL_BASE_URL=http://kb-api:8001). Needs Postgres with the pgvector
  # extension; it manages its own "kb" schema via its own Alembic migrations.
  # ---------------------------------------------------------------------------
  kb-api:
    build:
      context: ../../kb-service
      dockerfile: ../deploy/docker/Dockerfile.kb-service
    depends_on:
      db:
        condition: service_healthy
      kb-valkey:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Dedicated broker/result backend for the KB ingest pipeline (kept separate
  # from the backend's valkey so heavy ingest load can't starve app tasks).
  kb-valkey:
    image: valkey/valkey:7-alpine
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - kb_valkey_data:/data
    restart: unless-stopped

  # KB ingest workers — CPU queue (parse/chunk/embed dispatch) and IO queue
  # (embedding HTTP + vector writes). Enable with the "worker" profile.
  kb-worker-cpu:
    build:
      context: ../../kb-service
      dockerfile: ../deploy/docker/Dockerfile.kb-service
    command: celery -A app.workers.app worker -Q kb-cpu --pool=prefork --concurrency=2 --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      kb-valkey:
        condition: service_healthy
      litellm:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - worker

  kb-worker-io:
    build:
      context: ../../kb-service
      dockerfile: ../deploy/docker/Dockerfile.kb-service
    command: celery -A app.workers.app worker -Q kb-io,kb-notify --pool=threads --concurrency=50 --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      kb-valkey:
        condition: service_healthy
      litellm:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - worker

volumes:
  postgres_data:
  valkey_data:
  kb_valkey_data:

networks:
  default:
    name: agentic-app-network
