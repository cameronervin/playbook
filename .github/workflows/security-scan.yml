name: Security Scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  GO_VERSION: "1.24.x"
  GITLEAKS_VERSION: "v8.27.2"
  OSV_SCANNER_VERSION: "v2.4.0"
  TRIVY_VERSION: "v0.72.0"

jobs:
  scan:
    name: AppSec Scanner Gates
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go for scanner CLIs
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install OSS scanner CLIs
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit semgrep uv
          go install "github.com/gitleaks/gitleaks/v8@${GITLEAKS_VERSION}"
          go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify frontend lockfile
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Run blocking security scan
        run: ./deploy/scripts/security-scan.sh --build-images

      - name: Generate SBOM artifacts
        if: always()
        run: |
          ./deploy/scripts/generate-sbom.sh \
            --image playbook/backend:security-scan \
            --image playbook/frontend:security-scan \
            --image playbook/kb-service:security-scan \
            --image playbook/litellm:security-scan

      - name: Upload security scan artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-artifacts
          path: .artifacts/security-scan
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-artifacts
          path: .artifacts/sbom
          if-no-files-found: warn
          retention-days: 90
