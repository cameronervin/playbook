<style>
/* ============================================================
   PLAYBOOK — Design Tokens (inlined from the design system —
   the served .css can return a wrong MIME type, so inline is reliable).
   ============================================================ */

@font-face { font-family: 'Archivo'; src: url('fonts/Archivo-Variable.ttf') format('truetype-variations'); font-weight: 100 900; font-style: normal; font-display: swap; }
@font-face { font-family: 'Archivo'; src: url('fonts/Archivo-Italic-Variable.ttf') format('truetype-variations'); font-weight: 100 900; font-style: italic; font-display: swap; }
@font-face { font-family: 'Inter'; src: url('fonts/Inter-Variable.ttf') format('truetype-variations'); font-weight: 100 900; font-style: normal; font-display: swap; }
@font-face { font-family: 'Sora'; src: url('fonts/Sora-Variable.ttf') format('truetype-variations'); font-weight: 100 800; font-style: normal; font-display: swap; }

:root {
  --orange-50:#FFF3E9; --orange-100:#FFE0C4; --orange-200:#FFC089; --orange-300:#FF9D4D;
  --orange-400:#FF8224; --orange-500:#FF7300; --orange-600:#E85F00; --orange-700:#C24C00;
  --orange-800:#8F3800; --orange-900:#5E2500;
  --brand:var(--orange-500); --brand-hover:var(--orange-400); --brand-press:var(--orange-600);
  --brand-soft:rgba(255,115,0,0.14); --brand-glow:rgba(255,115,0,0.35);

  --ink-1000:#0C0B09; --ink-950:#100F0C; --ink-900:#16140F; --ink-850:#1C1A14; --ink-800:#221F18;
  --ink-750:#2A271E; --ink-700:#332F25; --ink-600:#423D30; --ink-500:#5A5343; --ink-400:#7E7665;
  --ink-300:#A89E8B; --ink-200:#CFC6B5; --ink-100:#E9E2D5; --ink-050:#F6F1E8;

  --fg-1:#F6F1E8; --fg-2:#C2B9A8; --fg-3:#8E8674; --fg-4:#5A5343; --fg-on-brand:#16140F;

  --bg-void:var(--ink-1000); --bg-page:var(--ink-950); --bg-base:var(--ink-900);
  --surface:var(--ink-850); --surface-raised:var(--ink-800); --surface-hover:var(--ink-750);

  --border:rgba(246,241,232,0.08); --border-strong:rgba(246,241,232,0.14);
  --border-solid:var(--ink-700); --border-brand:rgba(255,115,0,0.45);

  --success:#3FB68B; --success-bg:rgba(63,182,139,0.14);
  --warning:#F4A93C; --warning-bg:rgba(244,169,60,0.14);
  --danger:#F0563F;  --danger-bg:rgba(240,86,63,0.14);
  --info:#4FB6C7;    --info-bg:rgba(79,182,199,0.14);

  --font-display:'Archivo', system-ui, sans-serif;
  --font-display-alt:'Sora', system-ui, sans-serif;
  --font-body:'Inter', system-ui, sans-serif;
  --font-mono:'Inter', system-ui, sans-serif;

  --radius-xs:3px; --radius-sm:5px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-pill:999px;

  --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
  --shadow-md:0 4px 16px rgba(0,0,0,0.45);
  --shadow-lg:0 16px 48px rgba(0,0,0,0.55);
  --shadow-focus:0 0 0 3px var(--brand-glow);

  --ease-out:cubic-bezier(0.2,0.7,0.2,1);
  --ease-in-out:cubic-bezier(0.4,0,0.2,1);
  --dur-fast:120ms; --dur-med:200ms; --dur-slow:360ms;
}
</style>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg-base); }
  body { font-family: var(--font-body); color: var(--fg-1); -webkit-font-smoothing: antialiased; }
  #root { height: 100vh; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--ink-700); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-600); background-clip: padding-box; }
  textarea::placeholder, input::placeholder { color: var(--fg-4); }
  button { font-family: var(--font-body); }
  mark { background: transparent; color: var(--brand); font-weight: 600; }

  /* agent / live pulse */
  .pb-pulse { animation: pbpulse 1.9s var(--ease-in-out) infinite; }
  @keyframes pbpulse { 0% { box-shadow: 0 0 0 0 var(--pulse-color, var(--brand-glow)); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  /* thinking — pulsing Playbook mark + "Thinking…" */
  .pb-think { animation: pbthink 1.4s var(--ease-in-out) infinite; }
  @keyframes pbthink { 0%, 100% { opacity: .38; } 50% { opacity: 1; } }
  .pb-streaming::after { content: ''; display: inline-block; width: 7px; height: 1.02em; vertical-align: -2px; margin-left: 3px; border-radius: 1px; background: var(--brand); animation: pbblink 1.05s steps(1) infinite; }
  @keyframes pbblink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  .pb-spin { animation: pbspin 0.9s linear infinite; }
  @keyframes pbspin { to { transform: rotate(360deg); } }

  @keyframes pbmenu { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pbfade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pbrise { from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: none; } }
  @keyframes pbpanel { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
  @keyframes pbgrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  .pb-rise { animation: pbrise var(--dur-med) var(--ease-out) both; }

  @media (prefers-reduced-motion: reduce) {
    .pb-pulse, .pb-spin { animation: none; }
    .pb-think { animation: none; opacity: 1; }
    .pb-streaming::after { animation: none; }
    .pb-rise, [style*="pbpanel"] { animation: none !important; }
  }

  /* faint technical grid seated behind page headers */
  .admin-grid {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image: linear-gradient(rgba(246,241,232,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(246,241,232,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(180deg, #000 0%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 100%);
  }
</style>
</head>
