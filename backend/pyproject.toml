[project]
name = "playbook-backend"
version = "0.1.0"
description = "Playbook FastAPI and LangGraph product backend."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "anthropic>=0.39.0",
    "asyncpg>=0.29.0",
    "boto3>=1.35.0",
    "celery[redis]>=5.4",
    "fastapi-users[oauth,sqlalchemy]>=13.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain>=0.3.0",
    "langfuse>=3.0.0",
    "langgraph-checkpoint-postgres>=1.0.0",
    "langgraph>=0.2.0",
    "litellm>=1.50.0",
    "psycopg[binary]>=3.1.0",
    "pydantic-settings>=2.1.0",
    "pydantic>=2.5.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "structlog>=24.1.0",
    "uvicorn[standard]>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest>=7.4.0",
    "ruff>=0.6.0",
]
evals = [
    "click>=8.1",
    "ragas>=0.4.3,<0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external services",
    "db: marks tests that require the test database",
]

[tool.coverage.run]
branch = false
source = ["app"]
omit = [
    "app/infrastructure/db/base.py",
    "*/migrations/*",
    "*/alembic/*",
    # Celery/worker entrypoints and thin pass-through repositories are better
    # covered by integration tests than the unit suite.
    "app/workers/session.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
